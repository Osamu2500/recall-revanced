<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Vibrant Orange Background Gradient -->
    <linearGradient id="orangeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7347"/>
      <stop offset="50%" stop-color="#f05622"/>
      <stop offset="100%" stop-color="#c8380e"/>
    </linearGradient>

    <!-- Subtle Top Edge Highlight for App Icon Depth -->
    <linearGradient id="topHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Drop Shadow for Front R -->
    <filter id="shadowFront" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- Drop Shadow for Back R -->
    <filter id="shadowBack" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Orange Squircle Background (Rx=116 for perfect modern squircle icon) -->
  <rect width="512" height="512" rx="116" fill="url(#orangeBg)"/>
  <rect width="512" height="512" rx="116" fill="url(#topHighlight)" style="mix-blend-mode: overlay;"/>

  <!-- BACK R (Dark Obsidian #141416 with Subtle White Edge) -->
  <g transform="translate(48, 56) scale(4.16)" filter="url(#shadowBack)">
    <path fill-rule="evenodd"
      d="M 25 18 L 55 18 C 72 18, 78 26, 78 36 C 78 46, 70 52, 58 54 L 78 82 L 58 82 L 42 56 L 41 56 L 41 82 L 25 82 Z M 41 32 L 41 43 L 53 43 C 59 43, 62 40, 62 37 C 62 34, 59 32, 53 32 Z"
      fill="#141416"
      stroke="rgba(255, 255, 255, 0.22)"
      stroke-width="1.2"
      stroke-linejoin="round"/>
  </g>

  <!-- FRONT R (Pure Bright White #ffffff) -->
  <g transform="translate(-16, -16) scale(4.16)" filter="url(#shadowFront)">
    <path fill-rule="evenodd"
      d="M 25 18 L 55 18 C 72 18, 78 26, 78 36 C 78 46, 70 52, 58 54 L 78 82 L 58 82 L 42 56 L 41 56 L 41 82 L 25 82 Z M 41 32 L 41 43 L 53 43 C 59 43, 62 40, 62 37 C 62 34, 59 32, 53 32 Z"
      fill="#ffffff"/>
  </g>
</svg>
