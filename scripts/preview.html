<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recall Revanced — Logo Preview</title>
  <style>
    .pixelated { image-rendering: pixelated; }
    body {
      background: #0f0f10;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      gap: 32px;
    }
    h1 { font-size: 24px; font-weight: 700; color: #fff; margin: 0; }
    .grid {
      display: flex;
      align-items: center;
      gap: 40px;
      background: #18181b;
      padding: 40px 60px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .item span {
      font-size: 13px;
      color: #a1a1aa;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <h1>Recall Revanced — Logo Design</h1>
  <div class="grid">
    <div class="item">
      <img src="../icons/logo.svg" width="160" height="160" alt="SVG Vector Logo">
      <span>Vector SVG (Master)</span>
    </div>
    <div class="item">
      <img src="../icons/icon128.png" width="128" height="128" alt="PNG 128x128">
      <span>128 × 128 PNG</span>
    </div>
    <div class="item">
      <img src="../icons/icon48.png" width="48" height="48" alt="PNG 48x48">
      <span>48 × 48 PNG</span>
    </div>
    <div class="item">
      <img src="../icons/icon16.png" width="32" height="32" alt="PNG 16x16" class="pixelated">
      <span>16 × 16 PNG</span>
    </div>
  </div>
</body>
</html>
